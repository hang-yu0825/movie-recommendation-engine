    <text x="66" y="100" text-anchor="end" font-size="12" fill="#64748b">0.95</text>
    <text x="66" y="185" text-anchor="end" font-size="12" fill="#64748b">0.91</text>
    <text x="66" y="270" text-anchor="end" font-size="12" fill="#64748b">0.87</text>
    <text x="66" y="355" text-anchor="end" font-size="12" fill="#64748b">0.83</text>
    <polyline fill="none" stroke="#2563eb" stroke-width="3" points="80,93 116,174 153,184 189,188 225,190 262,192 298,197 334,208 371,223 407,236 443,247 480,259 516,271 552,284 589,295 625,306 661,317 698,328 734,338 770,348"/>
    <g fill="#2563eb">
      <circle cx="80" cy="93" r="4"/><circle cx="116" cy="174" r="4"/><circle cx="153" cy="184" r="4"/><circle cx="189" cy="188" r="4"/><circle cx="225" cy="190" r="4"/><circle cx="262" cy="192" r="4"/><circle cx="298" cy="197" r="4"/><circle cx="334" cy="208" r="4"/><circle cx="371" cy="223" r="4"/><circle cx="407" cy="236" r="4"/><circle cx="443" cy="247" r="4"/><circle cx="480" cy="259" r="4"/><circle cx="516" cy="271" r="4"/><circle cx="552" cy="284" r="4"/><circle cx="589" cy="295" r="4"/><circle cx="625" cy="306" r="4"/><circle cx="661" cy="317" r="4"/><circle cx="698" cy="328" r="4"/><circle cx="734" cy="338" r="4"/><circle cx="770" cy="348" r="4"/>
