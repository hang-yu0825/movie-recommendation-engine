<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc">
  <title id="title">Matrix factorisation training RMSE</title>
  <desc id="desc">Training RMSE decreases from 0.9510 at epoch one to 0.8324 at epoch twenty.</desc>
  <rect width="820" height="440" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Biased matrix factorisation training convergence</text>
    <line x1="80" y1="360" x2="770" y2="360" stroke="#64748b"/>
    <line x1="80" y1="75" x2="80" y2="360" stroke="#64748b"/>
    <line x1="80" y1="95" x2="770" y2="95" stroke="#e2e8f0"/>
